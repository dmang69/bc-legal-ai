# BC Legal AI Associate — local / lab stack
# Usage: docker compose up --build
# Change all default passwords before any shared host.
# App applies portable M1 schema on API startup (init_db).

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_MODE: development
      ALA_POSTGRES_URL: postgresql://ala:ala_dev_change_me@postgres:5432/ala
      ALA_PG_POOL: "1"
      ALA_PG_POOL_MIN: "1"
      ALA_PG_POOL_MAX: "10"
      ALA_REDIS_URL: redis://redis:6379/0
      ALA_S3_ENDPOINT: http://minio:9000
      ALA_COOKIE_SECURE: "0"
      ALA_COOKIE_SAMESITE: lax
      ALA_RATE_LIMIT_DISABLED: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ala
      POSTGRES_PASSWORD: ala_dev_change_me
      POSTGRES_DB: ala
    ports:
      - "5432:5432"
    volumes:
      - ala_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ala -d ala"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ala_minio
      MINIO_ROOT_PASSWORD: ala_dev_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ala_minio:/data

volumes:
  ala_pg:
  ala_minio:
