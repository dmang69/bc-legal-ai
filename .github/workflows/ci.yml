name: CI — Build & Test

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run ruff linter
        run: ruff check backend/ services/ agents/ middleware/ knowledgebase/ || true
      - name: Run ruff formatter check
        run: ruff format --check backend/ services/ agents/ middleware/ knowledgebase/ || true

  test:
    name: Test Suite (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,export,pdf]"
          pip install pypdf python-docx httpx pyyaml fastapi uvicorn pydantic pytest
      - name: Confidential scan
        run: python scripts/scan_confidential.py .
      - name: Run pytest (SQLite)
        env:
          APP_MODE: development
          ALA_RATE_LIMIT_DISABLED: "1"
        run: pytest tests/ -q --tb=short -m "not postgres_required"
      - name: Deployment readiness (public demo)
        env:
          APP_MODE: public_demo
        run: python scripts/validate_deployment_readiness.py

  test-postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ala
          POSTGRES_PASSWORD: ala_test
          POSTGRES_DB: ala_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ala -d ala_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project with Postgres extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,export,pdf]"
          pip install "psycopg[binary]>=3.1" pypdf python-docx httpx pyyaml fastapi uvicorn pydantic pytest
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U ala && break
            sleep 1
          done
      - name: Run Postgres integration tests
        env:
          APP_MODE: development
          ALA_RATE_LIMIT_DISABLED: "1"
          ALA_PG_POOL: "0"
          ALA_POSTGRES_URL: postgresql://ala:ala_test@localhost:5432/ala_test
        run: pytest tests/test_postgres_integration.py -v --tb=short

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit security scanner
        run: bandit -r backend/ -f json -o bandit-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build . --file Dockerfile --tag ${{ env.IMAGE_NAME }}:ci-test
      - name: Run container smoke test
        run: |
          docker run -d --name ala-test -p 8000:8000 -e APP_MODE=development ${{ env.IMAGE_NAME }}:ci-test
          sleep 8
          curl -f http://localhost:8000/health/live || exit 1
          curl -f http://localhost:8000/health || exit 1
          docker stop ala-test
          docker rm ala-test
