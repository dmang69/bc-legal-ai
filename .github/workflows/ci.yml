name: CI — Build & Test

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run ruff linter
        run: ruff check backend/ services/ agents/ middleware/
      - name: Run ruff formatter check
        run: ruff format --check backend/ services/ agents/ middleware/

  test:
    name: Test Suite (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        run: pytest tests/ -v --tb=short --cov=backend --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-postgres:
    name: Test Suite (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ala
          POSTGRES_PASSWORD: ala_test
          POSTGRES_DB: ala_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,pdf,ocr]"
      - name: Run pytest with PostgreSQL
        env:
          ALA_POSTGRES_URL: postgresql://ala:ala_test@localhost:5432/ala_test
        run: pytest tests/ -v --tb=short -k "postgres or integration"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit security scanner
        run: bandit -r backend/ -f json -o bandit-report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build . --file Dockerfile --tag ${{ env.IMAGE_NAME }}:ci-test
      - name: Run container smoke test
        run: |
          docker run -d --name ala-test -p 8000:8000 ${{ env.IMAGE_NAME }}:ci-test
          sleep 5
          curl -f http://localhost:8000/health/live || exit 1
          curl -f http://localhost:8000/health || exit 1
          docker stop ala-test
          docker rm ala-test
