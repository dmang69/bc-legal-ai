# Tag release orchestration: relies on publish-ghcr.yml for the image.
# Creates a GitHub Release with GHCR pull instructions when a version tag is pushed.

name: Release notes

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image coordinates
        id: img
        run: |
          NAME="${{ github.repository }}"
          echo "image=ghcr.io/${NAME,,}" >> "$GITHUB_OUTPUT"
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Build release body
        id: body
        run: |
          IMAGE="${{ steps.img.outputs.image }}"
          VER="${{ steps.img.outputs.version }}"
          TAG="${{ steps.img.outputs.tag }}"
          NOTES=""
          if [ -f "releases/${TAG}.md" ]; then
            NOTES=$(cat "releases/${TAG}.md")
          elif [ -f "releases/v${VER}.md" ]; then
            NOTES=$(cat "releases/v${VER}.md")
          else
            NOTES="Release ${TAG}"
          fi
          {
            echo "$NOTES"
            echo ""
            echo "---"
            echo ""
            echo "## Docker (GitHub Container Registry)"
            echo ""
            echo "\`\`\`bash"
            echo "docker pull ${IMAGE}:${VER}"
            echo "docker run --rm -p 8000:8000 \\"
            echo "  -e APP_MODE=development \\"
            echo "  ${IMAGE}:${VER}"
            echo "# API: http://127.0.0.1:8000/docs"
            echo "\`\`\`"
            echo ""
            echo "Also tagged: \`${IMAGE}:latest\` (on version tags), \`${IMAGE}:edge\` (main)."
            echo ""
            echo "Package: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}"
            echo ""
            echo "Not legal advice. Synthetic/supervised use only unless you operate a secured deployment."
          } > /tmp/release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
