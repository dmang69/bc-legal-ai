# API Deployment — image from GitHub Container Registry
#   ghcr.io/dmang69/bc-legal-ai:latest | :edge | :1.0.0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ala-api
  namespace: ala
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ala-api
  template:
    metadata:
      labels:
        app: ala-api
    spec:
      containers:
        - name: api
          image: ghcr.io/dmang69/bc-legal-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: APP_MODE
              value: production
          envFrom:
            - secretRef:
                name: ala-runtime
                optional: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ala-api
  namespace: ala
spec:
  selector:
    app: ala-api
  ports:
    - port: 80
      targetPort: 8000
